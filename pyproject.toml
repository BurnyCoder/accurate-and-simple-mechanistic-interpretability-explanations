[project]
name = "concise-interp"
version = "0.1.0"
description = "Length-penalized detection scoring for SAE feature explanations (accurate and short)"
readme = "README.md"
authors = [
    { name = "BurnyCoder", email = "happymancz@email.cz" }
]
requires-python = ">=3.12"
dependencies = [
    "eai-delphi[visualize]",
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "python-dotenv>=1.2.4",
    "sae-lens>=6.54.12",
    "scipy>=1.18.1",
    "tiktoken>=0.14.0",
]

[build-system]
requires = ["uv_build>=0.11.27,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[tool.uv.sources]
eai-delphi = { git = "https://github.com/EleutherAI/delphi", rev = "4fea06e6e8b68eeaf302474325fca13df95c5d6f" }
